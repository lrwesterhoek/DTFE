# Two jobs. build-and-test -- the Linux CPU build of all three binary pairs (single, DOUBLE=1, DIM=2)
# and the test battery through tests/ci_suite.sh, the SAME list the Dockerfile runs, so the two cannot
# drift (a previous cross-platform-test.yml was removed on purpose, commit eb243c8; this job stays
# CPU-only -- it exists to catch "does not compile on Linux", "the deposit broke" and "the GUI no
# longer runs what it shows" regressions). The Metal GPU path is macOS-only and validated locally
# (tests/dtfe_metal_check.sh, tests/gpu_scalar_check.sh, tests/gpu_mass_check.sh, metal/validate_deposit.cpp).
# cuda-compile -- the CUDA/HIP backend (src/CGAL_triangulation/*_gpu_cuda.cu, a port of the Metal
# kernels) compiled with nvcc in NVIDIA's toolkit image: no GPU on the runner, so this only keeps the
# port compiling (the two .cu files are self-contained, so no CGAL is needed for this).
# hip-compile -- the same port compiled with ROCm's hipcc (AMD), compile only as well.
# old-python -- every .py parses under Python 3.10, the oldest pyproject supports (2026-10-11: ci_suite's
# check skipped on the runner, which has no 3.10, so a PEP 701 f-string could pass CI).
# cudaemu -- the CUDA/HIP port RUN (not only compiled) through its CPU emulation (CUDAEMU=1, gpu_cuda_emu.h): the
# GPU parity suites via tests/cudaemu_check.sh at warp 32 (CUDA) and 64 (HIP wavefront). Validates the
# transliteration and the host logic, not real hardware (2026-10-11).
# compile-variants -- what users build beyond the pairs: no TBB and no libdeflate (neither installed),
# 'make library' and the demo/examples program linked against it (tests/ci_suite.sh variants).
# The C++ jobs share their compiler output through ccache (Debian's /usr/lib/ccache masquerade: the
# Makefile's 'which g++' finds it first on PATH, so nothing in the Makefile changes).

name: ci

# The working branch is Phase-Space: until 2026-10-02 the workflow ran only on master and on pull
# requests, so it never ran at all. workflow_dispatch adds a manual "Run workflow" button.
on:
  push:
    branches: [master, Phase-Space]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # 60 until 2026-10-15: the single-precision battery alone outgrew it on the 4-core runner (cancelled at 1 h in
    # 'Test battery (single precision)'; locally it is 18 min on 10 cores), the double and 2D passes come after it
    timeout-minutes: 150
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libboost-all-dev libcgal-dev libtbb-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev libdeflate-dev \
            python3 python3-numpy python3-h5py python3-scipy python3-matplotlib ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"   # what the cache step saves (~ is not expanded in env:)

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-build-and-test-${{ hashFiles('Makefile', 'src/**') }}
          restore-keys: ccache-build-and-test-

      # single + DOUBLE=1 + DIM=2: each is a separate compile of every translation unit, so only a
      # build catches a float-only or 3D-only construct creeping in (the 2D build was broken for a
      # day by the 3D-only cache reader before anyone noticed)
      - name: Build the single, double and 2D binaries (CPU-only)
        run: tests/ci_suite.sh build

      # every CPU suite against ./DTFE and ./PS-DTFE (tests/ci_suite.sh lists them, with why); since
      # 2026-10-11 with the standard-DTFE regression against its STORED reference (it compared nothing
      # here before) and the auto-tune and --scratch-dir suites (ported off macOS-only commands)
      - name: Test battery (single precision)
        run: tests/ci_suite.sh core

      # The GUI (python/gui). The job-spec test is pure Python; the end-to-end test drives the real
      # window offscreen through REAL runs of every tab on synthetic data (the Data tab through a
      # fake wget, so no network), which needs PySide6 (in a venv: Ubuntu's python refuses pip), the
      # libraries of Qt's offscreen platform, and matplotlib + scipy for the plot scripts.
      # DTFE_GUI_TEST_REQUIRED=1 (set by ci_suite.sh) turns its "PySide6 missing" skip into a failure.
      - name: GUI job specifications + end-to-end (PySide6, offscreen)
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-matplotlib python3-scipy \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
          python3 -m venv --system-site-packages "$RUNNER_TEMP/gui-venv"
          "$RUNNER_TEMP/gui-venv/bin/pip" install --quiet PySide6
          DTFE_GUI_PYTHON="$RUNNER_TEMP/gui-venv/bin/python" tests/ci_suite.sh gui

      # the double pair against the single pair, then the program-running suites again against the
      # double pair (DTFE_TEST_PRECISION=double reads their float64 grids; tests/precision.sh)
      - name: Test battery (double precision)
        run: tests/ci_suite.sh double

      - name: 2D phase space against analytic 2D flows
        run: tests/ci_suite.sh 2d

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

  old-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # update-environment false: the 3.10 stays OFF the PATH (it has no numpy); the stage is handed its path
      - id: py310
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          update-environment: false
      - name: Every .py parses under Python 3.10
        run: OLD_PYTHON="${{ steps.py310.outputs.python-path }}" tests/ci_suite.sh oldpy

  compile-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      # deliberately WITHOUT libtbb-dev and libdeflate-dev: the build must not need them
      - name: Install dependencies (no TBB, no libdeflate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libboost-all-dev libcgal-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"   # what the cache step saves (~ is not expanded in env:)
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-compile-variants-${{ hashFiles('Makefile', 'src/**', 'demo/examples/**') }}
          restore-keys: ccache-compile-variants-
      - name: TBB=0 LIBDEFLATE=0 build, make library, the demo/examples program
        run: tests/ci_suite.sh variants
      - name: Compiler cache statistics
        if: always()
        run: ccache -s

  cudaemu:
    runs-on: ubuntu-24.04
    # non-blocking until its first green run on the runners' x86-64 (the emulation's context switch has run there
    # only under Rosetta); the Linux-only std::bad_alloc that made it red is fixed (src/subpartition.h, 2026-10-11)
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        warp: [32, 64]
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libboost-all-dev libcgal-dev libtbb-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev libdeflate-dev \
            python3 python3-numpy python3-h5py python3-scipy python3-matplotlib ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cudaemu-${{ hashFiles('Makefile', 'src/**') }}
          restore-keys: ccache-cudaemu-
      # the CUDA/HIP sources compiled as plain C++ against the CPU emulation of the device (no GPU needed)
      - name: Build DTFE and PS-DTFE with CUDAEMU=1
        run: make DTFE PS-DTFE CUDAEMU=1 -j"$(nproc)"
      - name: GPU parity suites through the emulated CUDA/HIP backend (warp ${{ matrix.warp }})
        env:
          DTFE_TEST_TMP: ${{ runner.temp }}/dtfe-tests   # the suites' grids, outside the checkout
        run: CUDAEMU_WARPS=${{ matrix.warp }} tests/cudaemu_check.sh
      - name: Keep the suites' output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cudaemu-logs-w${{ matrix.warp }}
          path: ${{ runner.temp }}/dtfe-tests/cudaemu_check/
      - name: Compiler cache statistics
        if: always()
        run: ccache -s

  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 15
    steps:
      - name: git for the checkout (the toolkit image has none)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: "Compile the CUDA/HIP backend with nvcc (no device: compile only)"
        run: |
          cd src/CGAL_triangulation
          nvcc -O3 -std=c++17 -Xcompiler -fPIC -c ps_gpu_cuda.cu   -o /tmp/ps_gpu_cuda.o
          nvcc -O3 -std=c++17 -Xcompiler -fPIC -c dtfe_gpu_cuda.cu -o /tmp/dtfe_gpu_cuda.o
          ls -la /tmp/*_gpu_cuda.o

  # The same two files as HIP (AMD, ROCm's hipcc, '-x hip' as the Makefile's HIP=1 build): compile only,
  # for one common datacenter target. First compiled 2026-10-02 (HIP 7.15, rocm/dev-ubuntu-24.04, under
  # x86 emulation): clean once gpuFree's [[nodiscard]] hipError_t was discarded explicitly.
  hip-compile:
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:latest
    timeout-minutes: 20
    steps:
      - name: git for the checkout (the ROCm image has none)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: "Compile the CUDA/HIP backend with hipcc (no device: compile only)"
        run: |
          cd src/CGAL_triangulation
          hipcc -O3 -std=c++17 -fPIC -x hip --offload-arch=gfx90a -c ps_gpu_cuda.cu   -o /tmp/ps_gpu_hip.o
          hipcc -O3 -std=c++17 -fPIC -x hip --offload-arch=gfx90a -c dtfe_gpu_cuda.cu -o /tmp/dtfe_gpu_hip.o
          ls -la /tmp/*_gpu_hip.o
