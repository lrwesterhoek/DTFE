# Two jobs. build-and-test -- the Linux CPU build of all three binary pairs (single, DOUBLE=1, DIM=2)
# and the test battery through tests/ci_suite.sh, the SAME list the Dockerfile runs, so the two cannot
# drift (a previous cross-platform-test.yml was removed on purpose, commit eb243c8; this job stays
# CPU-only -- it exists to catch "does not compile on Linux", "the deposit broke" and "the GUI no
# longer runs what it shows" regressions). The Metal GPU path is macOS-only and validated locally
# (tests/dtfe_metal_check.sh, tests/gpu_scalar_check.sh, metal/validate_deposit.cpp).
# cuda-compile -- the CUDA/HIP backend (src/CGAL_triangulation/*_gpu_cuda.cu, a port of the Metal
# kernels) compiled with nvcc in NVIDIA's toolkit image: no GPU on the runner, so this only keeps the
# port compiling (the two .cu files are self-contained, so no CGAL is needed for this).
# hip-compile -- the same port compiled with ROCm's hipcc (AMD), compile only as well.

name: ci

# The working branch is Phase-Space: until 2026-10-02 the workflow ran only on master and on pull
# requests, so it never ran at all. workflow_dispatch adds a manual "Run workflow" button.
on:
  push:
    branches: [master, Phase-Space]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libboost-all-dev libcgal-dev libtbb-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev libdeflate-dev \
            python3 python3-numpy python3-h5py

      # single + DOUBLE=1 + DIM=2: each is a separate compile of every translation unit, so only a
      # build catches a float-only or 3D-only construct creeping in (the 2D build was broken for a
      # day by the 3D-only cache reader before anyone noticed)
      - name: Build the single, double and 2D binaries (CPU-only)
        run: tests/ci_suite.sh build

      # every CPU suite against ./DTFE and ./PS-DTFE (tests/ci_suite.sh lists them, with why)
      - name: Test battery (single precision)
        run: tests/ci_suite.sh core

      # The GUI (python/gui). The job-spec test is pure Python; the end-to-end test drives the real
      # window offscreen through REAL runs of every tab on synthetic data (the Data tab through a
      # fake wget, so no network), which needs PySide6 (in a venv: Ubuntu's python refuses pip), the
      # libraries of Qt's offscreen platform, and matplotlib + scipy for the plot scripts.
      # DTFE_GUI_TEST_REQUIRED=1 (set by ci_suite.sh) turns its "PySide6 missing" skip into a failure.
      - name: GUI job specifications + end-to-end (PySide6, offscreen)
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-matplotlib python3-scipy \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
          python3 -m venv --system-site-packages "$RUNNER_TEMP/gui-venv"
          "$RUNNER_TEMP/gui-venv/bin/pip" install --quiet PySide6
          DTFE_GUI_PYTHON="$RUNNER_TEMP/gui-venv/bin/python" tests/ci_suite.sh gui

      # the double pair against the single pair, then the program-running suites again against the
      # double pair (DTFE_TEST_PRECISION=double reads their float64 grids; tests/precision.sh)
      - name: Test battery (double precision)
        run: tests/ci_suite.sh double

      - name: 2D phase space against analytic 2D flows
        run: tests/ci_suite.sh 2d

  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 15
    steps:
      - name: git for the checkout (the toolkit image has none)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: "Compile the CUDA/HIP backend with nvcc (no device: compile only)"
        run: |
          cd src/CGAL_triangulation
          nvcc -O3 -std=c++17 -Xcompiler -fPIC -c ps_gpu_cuda.cu   -o /tmp/ps_gpu_cuda.o
          nvcc -O3 -std=c++17 -Xcompiler -fPIC -c dtfe_gpu_cuda.cu -o /tmp/dtfe_gpu_cuda.o
          ls -la /tmp/*_gpu_cuda.o

  # The same two files as HIP (AMD, ROCm's hipcc, '-x hip' as the Makefile's HIP=1 build): compile only,
  # for one common datacenter target. First compiled 2026-10-02 (HIP 7.15, rocm/dev-ubuntu-24.04, under
  # x86 emulation): clean once gpuFree's [[nodiscard]] hipError_t was discarded explicitly.
  hip-compile:
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:latest
    timeout-minutes: 20
    steps:
      - name: git for the checkout (the ROCm image has none)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: "Compile the CUDA/HIP backend with hipcc (no device: compile only)"
        run: |
          cd src/CGAL_triangulation
          hipcc -O3 -std=c++17 -fPIC -x hip --offload-arch=gfx90a -c ps_gpu_cuda.cu   -o /tmp/ps_gpu_hip.o
          hipcc -O3 -std=c++17 -fPIC -x hip --offload-arch=gfx90a -c dtfe_gpu_cuda.cu -o /tmp/dtfe_gpu_hip.o
          ls -la /tmp/*_gpu_hip.o
