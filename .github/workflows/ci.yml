# One job, deliberately small: build-and-test -- the fast Linux CPU build + test battery
# (a previous cross-platform-test.yml was removed on purpose, commit eb243c8; this job stays
# CPU-only and under ~15 minutes -- it exists to catch "does not compile on Linux" and "the
# deposit broke" regressions, nothing more). The Metal GPU path is macOS-only and validated
# locally (tests/dtfe_metal_check.sh, metal/validate_deposit.cpp).

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libboost-all-dev libcgal-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev \
            python3 python3-numpy python3-h5py

      - name: Check dependencies
        run: make deps-check

      - name: Build DTFE + PS-DTFE (CPU-only)
        run: |
          make DTFE    ARCH_FLAGS="-mtune=generic" -j"$(nproc)"
          make PS-DTFE ARCH_FLAGS="-mtune=generic" -j"$(nproc)"

      - name: Standard-DTFE regression
        run: python3 tests/run_tests.py

      - name: PS-DTFE smoke test
        run: tests/ps_smoke_test.sh --no-build

      # The PS flag suites. None of these ran in CI before, which is how two stale
      # assertions in ps_linear_deposit_check sat red for days unnoticed -- run_tests.py and
      # the smoke test never pass a single PS flag. ps_auto_tune_check and ps_scratch_check
      # stay local-only: they use macOS-isms (/usr/bin/time -l, /private/tmp).
      - name: PS-DTFE regression (analytic pancake)
        run: python3 tests/ps_regression_test.py --no-build

      - name: PS-DTFE linear/exact deposit checks
        run: tests/ps_linear_deposit_check.sh --no-build

      - name: PS-DTFE halo-release check
        run: tests/ps_halo_release_check.sh --no-build

      - name: PS-DTFE vertex-mass check
        run: tests/ps_vertex_mass_check.sh --no-build

      - name: PS-DTFE volume-weighted check
        run: tests/ps_volume_weighted_check.sh --no-build
